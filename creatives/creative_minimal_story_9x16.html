<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1920px; overflow: hidden; position: relative;
    background-color: #111;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .bg-image {
    position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
    object-fit: cover; z-index: 1; filter: brightness(0.95) contrast(1.03);
  }
  .lighting-overlay {
    position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 25%, transparent 70%, rgba(0,0,0,0.45) 100%);
    z-index: 2; pointer-events: none;
  }
  .product-wrapper {
    position: absolute; z-index: 3; pointer-events: none;
  }
  .product-img {
    width: 100%; height: auto; display: block;
    filter: drop-shadow(0 35px 50px rgba(0,0,0,0.75)) drop-shadow(0 12px 20px rgba(0,0,0,0.5));
  }
  .deal-header {
    position: absolute; top: 180px; left: 80px; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-start;
  }
  .badge-limited {
    background-color: #C8102E; color: #FFFFFF;
    font-size: 42px; font-weight: 900; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 16px 32px; display: inline-block;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .price-was {
    color: #C8102E; font-size: 44px; font-weight: 800;
    margin-top: 18px; margin-left: 2px;
    text-decoration: line-through; text-decoration-color: #C8102E; text-decoration-thickness: 4px;
    letter-spacing: 0.5px; text-shadow: 0 1px 3px rgba(255,255,255,0.95);
  }
  .price-now-box {
    background-color: #FFFFFF; color: #C8102E;
    font-size: 78px; font-weight: 900; letter-spacing: -0.5px;
    padding: 16px 34px; margin-top: 16px; display: inline-block;
    box-shadow: 0 8px 25px rgba(0,0,0,0.22);
  }
  .save-circle-badge {
    position: absolute; z-index: 10;
    width: 210px; height: 210px; background-color: #C8102E; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4); text-align: center;
  }
  .save-circle-badge .save-title {
    color: #FFFFFF; font-size: 34px; font-weight: 800; letter-spacing: 1px; line-height: 1.1;
  }
  .save-circle-badge .save-val {
    color: #FFFFFF; font-size: 48px; font-weight: 900; line-height: 1.1; margin-top: 4px;
  }
  .swipe-cta {
    position: absolute; bottom: 240px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: #FFFFFF; color: #C8102E;
    font-size: 32px; font-weight: 900; letter-spacing: 1px;
    padding: 16px 48px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); text-align: center;
  }
  .logo-bottom-right {
    position: absolute; bottom: 120px; right: 80px; z-index: 10;
    width: 340px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
  }
  .logo-bottom-right img { width: 100%; height: auto; display: block; }
</style>
</head>
